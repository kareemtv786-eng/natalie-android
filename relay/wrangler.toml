name = "natalie-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "Conversation"

[exports.Conversation]
type = "durable-object"
storage = "sqlite"

[assets]
directory = "./pwa/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/v1/*", "/health" ]
